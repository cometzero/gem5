---
# Diagnostic saturation model; not an NPU-01 hardware prediction.
# Public-source candidate, not target-silicon calibration.
# Exclusive clean victims use native SnpOnce pull; DCT is off in this profile.
# Public manufacturer-document mirror candidate, not identified Zena BOM.
# Documented execution limits; not silicon-calibrated.
cpu:
    execution_profile: a720ae_documented
# Capacity/mesh dimensions follow Zena guide. Home count and placement
# remain explicit modelling assumptions pending integration evidence.
cmn:
    slc_size_mib_total: 4
    slc_size_kib_per_home: 512
    mesh:
        rows: 6
        columns: 4
        cluster_attach: [5, 6, 17, 18]
        home_attach: [0, 3, 5, 10, 13, 18, 20, 23]
        snf_attach_for_16_channels: [0, 1, 2, 3, 4, 6, 8, 10, 13, 15, 17, 19, 20, 21, 22, 23]
memory:
    custom_module: zena_cmn.lpddr5x_hynix
    custom_class: HynixH58G56CK8BX146_8533_1x16_BG_BL32_Documented
    preserve_device_geometry: true
    create_future_npu_arbiter_now: true
cache:
    l1d:
        data_latency_cycles: 1
    l2:
        policy: exclusive_data
        prefetch: stride

# NPU data bypasses HNF; SMMU maintenance remains coherent.
scope:
    npu_present: true
npu:
    enabled: true
    experimental_scaling: true
    enable_async_dma: true
    dma_width: 512
    dma_issue_width: 8
    max_outstanding: 1024
    sram_bank_width: 32
    bank_queue_depth: 16
    fabric_width: 512
    smmu:
        device_xlate_slots: 1024
        device_wrbuf_slots: 1024
        device_utlb_slots: 8
        device_tlb_slots: 16
        xlate_slots: 256
        ptw_slots: 64
